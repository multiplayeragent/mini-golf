<script type="module">
/* ═══ MINI GOLF · a Multiplayer Agent starter ════════════════════════════════════════
 * Everyone putts at the same time. Versus, 1–8 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, ball physics, bots, and the HOLES (walls, cup, obstacles)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   PHYSICS ....... one function moves any ball: walls, bumpers, windmills, slopes, the cup; the bots' putt planning
 *   COURSE ........ builds the meshes of the hole being played, the camera framing
 *   ROUND (HOST) .. hole timer, scorecard, next hole, and the bots. Only the host writes these.
 *   MY BALL ....... aiming, putting, sinking. Each player writes only its own ball.
 *   HUD & CARD .... hole info, timer, scorecard, leaderboard
 *   INPUT ......... drag back and let go (mouse and touch are the same code)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player simulates its OWN ball and writes it to its entity as `b` (one JSON
 *     field: hole key, position, strokes, sunk) about 12 times a second while it rolls,
 *     plus `hb` (heartbeat) once a second and `n`/`c` (name, color) once. Balls pass
 *     through each other, so nobody needs anyone else's ball to play.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, version
 *     `v`, phase, hole, timer, the scorecard) and `bots` (the bots' balls). A new host
 *     adopts both from state and carries on.
 *   - The host ends a hole when every ball is in (or out of strokes) or the timer runs out,
 *     copies everyone's strokes into the scorecard, then moves to the next hole. Every
 *     client puts its ball on the tee when it sees the hole change.
 *   - Windmills spin on the clock (Date.now()), so they need no syncing.
 *   - Intent: "again" {} from the final card asks the host to start a new round now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fewest-strokes": your total for a full round, stored as 1000 - strokes
 *     (boards keep the highest score), shown on the final card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the course up to this many balls
  holeTime: 60000,      // ms to play one hole
  scoresFor: 6000,      // ms the scorecard shows between holes
  finalFor: 20000,      // ms the final card shows before a new round starts
  maxStrokes: 6,        // after this many you pick up; a hole you don't finish scores maxStrokes + 1
  ballR: 0.3, cupR: 0.55,
  maxPower: 16,         // ball speed of a full-power putt, units/s
  rollDecel: 2.2,       // rolling friction, units/s²
  drag: 0.6,            // extra slowdown that grows with speed, per second
  wallBounce: 0.72,     // share of speed kept off a wall
  bumperBounce: 1.15,   // bumpers kick the ball back a bit faster
  capture: 7,           // the cup catches a ball slower than this
  dragFull: 0.3,        // drag this share of the screen for a full-power putt
  botWait: [700, 1900], // ms a bot waits before each putt
  botAim: 0.05,         // how far off a bot's aim is, radians
  botPower: 0.1,        // how far off a bot's power is, share
  board: "fewest-strokes",
  // The holes. x runs left-right, z from the tee (+) toward the cup (-). `walls` is the
  // outline, in order. blocks [x, z, width, depth, turn], bumpers [x, z, radius],
  // windmills [x, z, half-length, spin rad/s], slopes [x, z, width, depth, pushX, pushZ].
  holes: [
    { name: "Warm-up", par: 2, tee: [0, 9], cup: [0, -8.5], walls: [[-3.5, 11.5], [3.5, 11.5], [3.5, -11], [-3.5, -11]],
      bumpers: [[0, -1.5, 0.7]] },
    { name: "Dogleg", par: 3, tee: [0, 8.5], cup: [9, -6.5], walls: [[-3, 11], [3, 11], [3, -3], [12, -3], [12, -10], [-3, -10]],
      bumpers: [[-0.3, -7, 0.8]], blocks: [[7.5, -6.5, 0.5, 2.4, 0]] },
    { name: "Windmill", par: 3, tee: [0, 9.5], cup: [0, -9], walls: [[-4.5, 12], [4.5, 12], [4.5, -12], [-4.5, -12]],
      blocks: [[-3.1, 0, 2.8, 0.9, 0], [3.1, 0, 2.8, 0.9, 0]], windmills: [[0, 0, 1.6, 1.7]] },
    { name: "Zig-zag", par: 4, tee: [-2.5, 9.5], cup: [2.5, -9.5], walls: [[-5, 12], [5, 12], [5, -12], [-5, -12]],
      blocks: [[-1.4, 4, 7.2, 0.6, 0], [1.4, -4, 7.2, 0.6, 0]], bumpers: [[-4.3, -11.3, 0.5], [4.3, 11.3, 0.5]] },
    { name: "Bumper alley", par: 3, tee: [0, 10], cup: [0, -9.5], walls: [[-6, 12], [6, 12], [6, -12], [-6, -12]],
      bumpers: [[-2.5, 3, 0.8], [2.5, 3, 0.8], [0, -1, 0.9], [-3.4, -5, 0.7], [3.4, -5, 0.7]], slopes: [[0, 6.5, 12, 3, 3.2, 0]] },
    { name: "The funnel", par: 3, tee: [0, 10], cup: [0, -10], walls: [[-6, 12], [6, 12], [6, 2], [2, -4], [2, -12], [-2, -12], [-2, -4], [-6, 2]],
      slopes: [[0, -1, 8, 6, 0, -3.4]], windmills: [[0, -7, 1.6, -2.2]] },
  ],
};
const BOT_NAMES = ["Birdie", "Chip", "Bogey", "Putter", "Eagle", "Divot", "Fairway"];
const COLORS = ["#ff4d6d", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#3de0d0", "#f5f5f5"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'mini-golf',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
const WALL_T = 0.3, BAR_T = 0.4;
/** The hole as physics sees it: wall segments, bumpers, windmills, slopes, the cup. */
function buildCourse(i) {
  const h = CONFIG.holes[i % CONFIG.holes.length], segs = [];
  h.walls.forEach((p, k) => { const q = h.walls[(k + 1) % h.walls.length]; segs.push([p[0], p[1], q[0], q[1]]); });
  for (const [x, z, w, d, turn = 0] of h.blocks || []) {
    const c = Math.cos(turn), s = Math.sin(turn), pts = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([a, b]) => [x + a * c - b * s, z + a * s + b * c]);
    pts.forEach((p, k) => { const q = pts[(k + 1) % 4]; segs.push([p[0], p[1], q[0], q[1], 0]); });
  }
  return { i, h, segs, cup: { x: h.cup[0], z: h.cup[1] },
    bumpers: (h.bumpers || []).map(([x, z, r]) => ({ x, z, r, flash: 0 })),
    windmills: (h.windmills || []).map(([x, z, len, spin]) => ({ x, z, len, spin })),
    slopes: (h.slopes || []).map(([x, z, w, d, fx, fz]) => ({ x, z, w, d, fx, fz })) };
}
/** Push a ball out of segment a-b and bounce it. `vel(px, pz)` is the segment's own velocity (windmills). */
function hitSeg(b, ax, az, bx, bz, rad, bounce, vel) {
  const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz;
  const t = l ? Math.max(0, Math.min(1, ((b.x - ax) * dx + (b.z - az) * dz) / l)) : 0;
  const cx = ax + dx * t, cz = az + dz * t, ox = b.x - cx, oz = b.z - cz, d = Math.hypot(ox, oz);
  if (d >= rad || d < 1e-6) return false;
  const nx = ox / d, nz = oz / d, [sx, sz] = vel ? vel(cx, cz) : [0, 0];
  b.x = cx + nx * rad; b.z = cz + nz * rad;
  const rvx = b.vx - sx, rvz = b.vz - sz, dot = rvx * nx + rvz * nz;
  if (dot < 0) { b.vx = rvx - (1 + bounce) * dot * nx + sx; b.vz = rvz - (1 + bounce) * dot * nz + sz; }
  return true;
}
function inside(poly, x, z) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) ins = !ins;
  }
  return ins;
}
/** Move one ball for dt seconds at clock time t (seconds). Returns "in", "bumper", "wall" or null. */
function stepBall(b, dt, t, c) {
  if (!b.moving || b.in) return null;
  let ev = null;
  const n = Math.max(1, Math.ceil((Math.hypot(b.vx, b.vz) * dt) / (CONFIG.ballR * 0.5))), h = dt / n;
  for (let s = 0; s < n; s++) {
    for (const sl of c.slopes) if (Math.abs(b.x - sl.x) < sl.w / 2 && Math.abs(b.z - sl.z) < sl.d / 2) { b.vx += sl.fx * h; b.vz += sl.fz * h; }
    const v = Math.hypot(b.vx, b.vz);
    if (v > 0) { const k = Math.max(0, v - (CONFIG.rollDecel + CONFIG.drag * v) * h) / v; b.vx *= k; b.vz *= k; }
    b.x += b.vx * h; b.z += b.vz * h;
    for (const g of c.segs) if (hitSeg(b, g[0], g[1], g[2], g[3], CONFIG.ballR + WALL_T / 2, CONFIG.wallBounce)) ev = ev || "wall";
    for (const p of c.bumpers) {
      const ox = b.x - p.x, oz = b.z - p.z, d = Math.hypot(ox, oz), rad = p.r + CONFIG.ballR;
      if (d < rad && d > 1e-6) {
        const nx = ox / d, nz = oz / d, dot = b.vx * nx + b.vz * nz;
        b.x = p.x + nx * rad; b.z = p.z + nz * rad;
        if (dot < 0) { b.vx -= (1 + CONFIG.bumperBounce) * dot * nx; b.vz -= (1 + CONFIG.bumperBounce) * dot * nz; }
        const sp = Math.hypot(b.vx, b.vz); if (sp > CONFIG.maxPower) { b.vx *= CONFIG.maxPower / sp; b.vz *= CONFIG.maxPower / sp; }
        if (!b.sim) p.flash = 1;
        ev = "bumper";
      }
    }
    for (const w of c.windmills) {
      const a = w.spin * (t + s * h), ex = Math.cos(a) * w.len, ez = Math.sin(a) * w.len;
      if (hitSeg(b, w.x - ex, w.z - ez, w.x + ex, w.z + ez, CONFIG.ballR + BAR_T / 2, 0.8, (px, pz) => [-(pz - w.z) * w.spin, (px - w.x) * w.spin])) ev = ev || "wall";
    }
    const dx = c.cup.x - b.x, dz = c.cup.z - b.z, d = Math.hypot(dx, dz);
    if (d < CONFIG.cupR) {
      if (Math.hypot(b.vx, b.vz) < CONFIG.capture) { Object.assign(b, { x: c.cup.x, z: c.cup.z, vx: 0, vz: 0, moving: false, in: 1 }); return "in"; }
      if (d > 1e-3) { b.vx += (dx / d) * 20 * h; b.vz += (dz / d) * 20 * h; } // a fast ball lips out
    }
  }
  if (!inside(c.h.walls, b.x, b.z)) { Object.assign(b, { x: b.restX, z: b.restZ, vx: 0, vz: 0 }); } // escaped: back where it was
  if (Math.hypot(b.vx, b.vz) < 0.06) { b.vx = b.vz = 0; b.moving = false; }
  return ev;
}
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
/** Distance from a point to segment a-b. */
function segDist(x, z, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz, t = l ? Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / l)) : 0;
  return Math.hypot(x - ax - dx * t, z - az - dz * t);
}
/** How far each spot is from the cup going round the walls, blocks and bumpers: a grid filled outward from
 *  the cup. Bots judge a putt by this, so they go round a block instead of stopping behind it. */
function pathField(c) {
  const S = 0.5, xs = c.h.walls.map((p) => p[0]), zs = c.h.walls.map((p) => p[1]), x0 = Math.min(...xs), z0 = Math.min(...zs);
  const nx = Math.ceil((Math.max(...xs) - x0) / S) + 1, nz = Math.ceil((Math.max(...zs) - z0) / S) + 1, clear = CONFIG.ballR + WALL_T / 2 - 0.05;
  const free = (x, z) => inside(c.h.walls, x, z) && c.segs.every((g) => segDist(x, z, g[0], g[1], g[2], g[3]) > clear) && c.bumpers.every((p) => Math.hypot(x - p.x, z - p.z) > p.r + CONFIG.ballR);

  const ci = Math.round((c.cup.x - x0) / S), cj = Math.round((c.cup.z - z0) / S);
  d[cj * nx + ci] = Math.hypot(x0 + ci * S - c.cup.x, z0 + cj * S - c.cup.z);
  for (let changed = true; changed; ) { // relax every cell from its 8 neighbours until nothing gets shorter
    changed = false;
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i; if (!ok[k] && k !== cj * nx + ci) continue;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const ii = i + a, jj = j + b; if ((!a && !b) || ii < 0 || jj < 0 || ii >= nx || jj >= nz) continue;
        const v = d[jj * nx + ii] + (a && b ? Math.SQRT2 : 1) * S; if (v < d[k] - 1e-9) { d[k] = v; changed = true; }

    }

}
/** The way-round distance from (x, z) to the cup (nearest grid spots; straight-line plus a penalty if none). */
function pathTo(c, x, z) {
  const f = c.field || (c.field = pathField(c)), i0 = Math.round((x - f.x0) / f.S), j0 = Math.round((z - f.z0) / f.S);
  let best = Infinity;
  for (let j = j0 - 1; j <= j0 + 1; j++) for (let i = i0 - 1; i <= i0 + 1; i++) {
    if (i < 0 || j < 0 || i >= f.nx || j >= f.nz) continue;
    best = Math.min(best, f.d[j * f.nx + i] + Math.hypot(x - f.x0 - i * f.S, z - f.z0 - j * f.S));
  }

/** Bot brain: try many putts in a quick simulation and keep the one that ends nearest the cup (by the way round, pathTo). */
function planShot(b, c, skill) {
  const t0 = Date.now() / 1000, direct = Math.atan2(c.cup.z - b.z, c.cup.x - b.x);
  const angles = [];
  for (let k = -4; k <= 4; k++) angles.push(direct + k * 0.05);
  for (let k = 0; k < 24; k++) angles.push((k / 24) * Math.PI * 2);
  let best = { a: direct, p: 0.5, score: Infinity };
  for (const a of angles) for (const p of [0.45, 0.6, 0.3, 0.78, 0.18, 1]) { // middle powers first: a firm putt beats a dying one
    const sim = { x: b.x, z: b.z, vx: Math.cos(a) * p * CONFIG.maxPower, vz: Math.sin(a) * p * CONFIG.maxPower, moving: true, in: 0, restX: b.x, restZ: b.z, sim: true };
    let t = 0;
    while (sim.moving && t < 7) { stepBall(sim, 1 / 20, t0 + t, c); t += 1 / 20; }
    const score = sim.in ? -10 + p : pathTo(c, sim.x, sim.z);
    if (score < best.score) best = { a, p, score };
  }

const canPutt = (g) => g && g.phase === "play" && me.key === keyOf(g) && !me.moving && !finished(me);
function putt(angle, power) {
  Object.assign(me, { restX: me.x, restZ: me.z, vx: Math.cos(angle) * power * CONFIG.maxPower, vz: Math.sin(angle) * power * CONFIG.maxPower, moving: true, st: me.st + 1 });
  me.putts++; beep(420 + power * 300, 0.07, "triangle", 0.2); publish(true);
}
function myTick(dt, g) {
  if (me.key !== keyOf(g)) resetToTee(g);
  if (ATTRACT && canPutt(g)) { // the preview putts for you, like a bot
    if (!me.nextAuto) me.nextAuto = performance.now() + 300 + Math.random() * 600;
    else if (performance.now() > me.nextAuto) { me.nextAuto = 0; const s = planShot(me, course, 1); putt(s.a, s.p); }
  }
  const wasMoving = me.moving, ev = stepBall(me, dt, Date.now() / 1000, course);
  if (ev === "wall") beep(240, 0.04, "square", 0.04);
  if (ev === "bumper") beep(700, 0.06, "square", 0.06);
  if (ev === "in") { burst(me.x, me.z, myColor, 60); beep(660, 0.12); setTimeout(() => beep(990, 0.2), 110); if (!ATTRACT) toast(callout(me.st, course.h.par)); }
  if (wasMoving && !me.moving && !me.in && me.st >= CONFIG.maxStrokes && !ATTRACT) toast(`Picked up: ${CONFIG.maxStrokes + 1}`);
  publish(false);
}
function callout(st, par) {
  if (st === 1) return "Hole in one!";
  return { [-3]: "Albatross!", [-2]: "Eagle!", [-1]: "Birdie!", 0: "Par", 1: "Bogey" }[st - par] || `${st} strokes`;
}
function publish(force) {
  const now = performance.now();
  if (!force && now - me.lastSend < (me.moving ? 80 : 400)) return;
  const v = JSON.stringify({ k: me.key, x: +me.x.toFixed(2), z: +me.z.toFixed(2), st: me.st, in: me.in });
  if (v === me.sent && !force) return;
  me.lastSend = now; me.sent = v; net.me.set("b", v);
}
/** The putt the current drag would make: angle in the world, power 0..1. */
const ray = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function aimShot() {
  if (!aim) return null;
  const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
  const power = Math.min(1, len / (Math.min(innerWidth, innerHeight) * CONFIG.dragFull));
  if (power < 0.04) return null;
  const p = new THREE.Vector3(me.x, 0, me.z).project(camera), k = Math.min(1, 60 / len);
  ray.setFromCamera(new THREE.Vector2(p.x + ((dx * k) / innerWidth) * 2, p.y - ((dy * k) / innerHeight) * 2), camera);
  if (!ray.ray.intersectPlane(groundPlane, hit)) return null;
  return { a: Math.atan2(hit.z - me.z, hit.x - me.x), p: power };
}
// The aim arrow on the ground, and the "your turn" ring.
const arrowShape = new THREE.Shape([[0, -0.12], [0.8, -0.12], [0.8, -0.3], [1.2, 0], [0.8, 0.3], [0.8, 0.12], [0, 0.12]].map(([x, y]) => new THREE.Vector2(x, y)));
const arrow = new THREE.Mesh(new THREE.ShapeGeometry(arrowShape).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#fff", transparent: true, opacity: 0.9, depthWrite: false }));
arrow.visible = false; scene.add(arrow);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.45, 0.55, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#fff", transparent: true, opacity: 0.8, depthWrite: false }));
scene.add(ring);

// ── HUD & CARD ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1600) { const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
/** Strokes over the first n holes; a hole you missed counts as maxStrokes + 1. */
const total = (row, n = CONFIG.holes.length) => CONFIG.holes.slice(0, n).reduce((s, _, i) => s + (row.s[i] ?? CONFIG.maxStrokes + 1), 0);
let board = null, boardFor = "";
/** Colors other balls already use: players' and bots'. */
const takenColors = () => new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(parse(S.shared.bots, {}).list || []).map((b) => b.c)]);
/** Two players with one color (both joined at once), or a bot has mine: the later sessionId picks again. */
function fixColor() {
  if (!Object.entries(S.entities.players || {}).some(([id, p]) => id < net.sessionId && p.c === myColor) && !(parse(S.shared.bots, {}).list || []).some((b) => b.c === myColor)) return;
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("c", myColor);
  if (myBall) { dropBall(myBall); myBall = null; }
}
let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud(g) {
  fixColor();
  if (ATTRACT) { for (const id of ["hole", "clock", "mini", "net", "hint"]) $(id).textContent = ""; $("over").hidden = true; return; }
  const t = Date.now(), left = Math.max(0, Math.ceil((g.endsAt - t) / 1000));
  $("hole").innerHTML = `Hole ${g.hole + 1}/${CONFIG.holes.length} <small>${esc(course.h.name)} · Par ${course.h.par} · Strokes ${me.st}</small>`;
  $("clock").textContent = g.phase === "play" ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "";
  $("clock").classList.toggle("low", g.phase === "play" && left <= 10);
  const played = g.phase === "play" ? g.hole : g.hole + 1;
  const rows = Object.entries(g.card || {}).map(([id, r]) => ({ id, n: id === net.sessionId ? "You" : r.n, t: total(r, played) }));
  if (!rows.some((r) => r.id === net.sessionId)) rows.push({ id: net.sessionId, n: "You", t: 0 });
  rows.sort((a, b) => a.t - b.t);
  $("mini").innerHTML = g.hole > 0 || g.phase !== "play" ? rows.slice(0, 5).map((r) => `<div class="${r.id === net.sessionId ? "me" : ""}"><span>${esc(r.n)}</span><span>${r.t}</span></div>`).join("") : "";
  $("hint").textContent = g.phase === "play" && me.putts === 0 && canPutt(g) ? "Drag back from anywhere and let go to putt" : g.phase === "play" && finished(me) ? "Waiting for the others…" : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the course" : ""}`;
  $("over").hidden = g.phase === "play";
  if (g.phase !== "play") showCard(g, t);
}
function showCard(g, t) {
  const final = g.phase === "final", holes = CONFIG.holes;
  $("overTitle").textContent = final ? "Final scores" : `After hole ${g.hole + 1}`;
  const played = g.hole + 1, rows = Object.entries(g.card || {}).sort((a, b) => total(a[1], played) - total(b[1], played));
  $("card").innerHTML = `<tr><th>Player</th>${holes.map((_, i) => `<th>${i + 1}</th>`).join("")}<th>Tot</th></tr>` +
    `<tr><td>Par</td>${holes.map((h) => `<td>${h.par}</td>`).join("")}<td class="tot">${holes.reduce((s, h) => s + h.par, 0)}</td></tr>` +
    rows.map(([id, r]) => `<tr class="${id === net.sessionId ? "me" : ""}"><td><i style="background:${esc(r.c)}"></i>${esc(id === net.sessionId ? "You" : r.n)}</td>` +
      holes.map((h, i) => { const v = r.s[i]; return `<td class="${v == null ? "" : v < h.par ? "good" : v > h.par ? "bad" : ""}">${v ?? "–"}</td>`; }).join("") + `<td class="tot">${total(r, played)}</td></tr>`).join("");
  $("next").textContent = `${final ? "New round" : `Hole ${g.hole + 2}`} in ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s`;
  $("again").hidden = $("boardBox").hidden = !final;
  if (final && boardFor !== keyOf(g)) { boardFor = keyOf(g); showBoard(g); }
}
function showBoard(g) {
  const list = $("board"), mine = g.card[net.sessionId];
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  const full = mine && CONFIG.holes.every((_, i) => mine.s[i] != null);
  const submit = full && me.submitted !== g.id ? board.submit(Math.max(0, 1000 - total(mine))).catch(() => null) : Promise.resolve();
  me.submitted = g.id;
  list.innerHTML = "<li class='note'>Loading…</li>";
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${1000 - e.score} strokes</span></li>`).join("") : "<li class='note'>No full rounds yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "final") return; if (isHost()) newRound(g.id + 1); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (ATTRACT || !canPutt(game()) || aim) return;
  cv.setPointerCapture(e.pointerId);
  aim = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", (e) => { if (aim && e.pointerId === aim.id) { aim.x = e.clientX; aim.y = e.clientY; } });
cv.addEventListener("pointerup", (e) => {
  if (!aim || e.pointerId !== aim.id) return;
  const shot = aimShot(); aim = null;
  if (shot && canPutt(game())) putt(shot.a, shot.p);
});
cv.addEventListener("pointercancel", () => { aim = null; });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-button drag putts too, without the browser menu
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const views = new Map(); // id -> { g, x, z, in } drawn balls for everyone but me
const seenIn = new Map();
let myBall = null;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; host.doneAt = 0; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the round meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    if (!course || course.i !== g.hole % CONFIG.holes.length) showHole(g.hole);
    myTick(dt, g);
    // everyone else's balls, eased toward where they last said they were
    const seen = new Set();
    for (const b of balls(g)) {
      if (b.mine) continue;
      seen.add(b.id);
      let v = views.get(b.id);
      if (v && v.color !== b.color) { dropBall(v.g); views.delete(b.id); v = null; } // they changed color
      if (!v) { v = { g: makeBall(b.color, ATTRACT ? "" : b.name), color: b.color, x: b.x, z: b.z }; views.set(b.id, v); }
      const k = b.bot && isHost() ? 1 : 1 - Math.pow(0.0001, dt);
      v.x += (b.x - v.x) * k; v.z += (b.z - v.z) * k;
      placeBall(v.g, v.x, v.z, b.in && Math.hypot(v.x - b.x, v.z - b.z) < 0.2);
      const key = keyOf(g) + b.id;
      if (b.in && !seenIn.get(key)) { seenIn.set(key, 1); if (!(b.bot && isHost())) burst(course.cup.x, course.cup.z, b.color, 30); }
    }
    for (const [id, v] of views) if (!seen.has(id)) { dropBall(v.g); views.delete(id); }
    if (!myBall) myBall = makeBall(myColor, "");
    placeBall(myBall, me.x, me.z, me.in);
    const ready = canPutt(g) && !ATTRACT;
    ring.visible = ready; ring.position.set(me.x, 0.02, me.z); ring.scale.setScalar(1 + Math.sin(now / 200) * 0.12);
    const shot = aimShot();
    arrow.visible = !!shot && ready;
    if (shot) {
      arrow.position.set(me.x, 0.03, me.z); arrow.rotation.y = -shot.a; arrow.scale.set(0.8 + shot.p * 3.2, 1, 1 + shot.p * 0.6);
      arrow.material.color.setHSL((1 - shot.p) * 0.33, 0.9, 0.6);
    }
    // windmills, bumpers and the flag
    const tSec = Date.now() / 1000;
    course.windmills.forEach((w, i) => { course.windmillMeshes[i].rotation.y = -w.spin * tSec; });
    course.bumpers.forEach((p, i) => { p.flash = Math.max(0, p.flash - dt * 3); course.bumperMeshes[i].material.emissiveIntensity = p.flash; course.bumperMeshes[i].scale.setScalar(1 + p.flash * 0.12); });
    course.flag.rotation.y = Math.sin(tSec * 2.2) * 0.35 - 0.6;
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
  tickConfetti(dt);
  if (ATTRACT && course) { // the preview: closer, slowly swinging around the middle of the hole
    const az = 0.3 + Math.sin(now / 3000) * 0.18, el = 0.78, d = 21, [tx, tz] = course.h.tee;
    cam.wantLook.set((tx + course.cup.x) / 2, 0, (tz + course.cup.z) / 2);
    cam.wantPos.set(cam.wantLook.x + Math.cos(az) * Math.cos(el) * d, Math.sin(el) * d, cam.wantLook.z + Math.sin(az) * Math.cos(el) * d);
  }
  cam.pos.lerp(cam.wantPos, 1 - Math.pow(0.02, dt)); cam.look.lerp(cam.wantLook, 1 - Math.pow(0.02, dt));
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "final") newRound(g.id + 1); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 8, holeTime: 14000, scoresFor: 300, finalFor: 300, botWait: [250, 800] });
  showHole(ATTRACT ? 2 : 0);
  cam.pos.copy(cam.wantPos); cam.look.copy(cam.wantLook);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
